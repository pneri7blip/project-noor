<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#d9d1bd" />
    <meta name="description" content="Noor — uno spazio virtuale immersivo per preghiera, raccoglimento ed esplorazione." />
    <title>Noor — Uno spazio di quiete</title>
  </head>
  <body>
    <main id="app" aria-label="Project Noor immersive mosque">
      <div id="brand"><span class="brand-mark">ن</span><span><strong>NOOR</strong><small>UNO SPAZIO DI QUIETE</small></span></div>
      <div id="hint">Muovi · Esplora · Raccogliti</div>
      <div id="joystick" role="group" aria-label="Joystick per camminare"><div id="joystick-ring"><div id="joystick-knob"></div></div></div>
      <div id="action-bar" role="group" aria-label="Azioni dell’avatar">
        <button class="action-button" id="greet-action" type="button" aria-label="Saluta"> <span class="action-icon">✋</span><span>Saluta</span></button>
        <button class="action-button" id="pause-action" type="button" aria-label="Fermati e fai una pausa"><span class="action-icon">◌</span><span>Sosta</span></button>
      </div>
      <div id="presence-note" aria-live="polite">Uno spazio tranquillo, senza chat né classifiche.</div>
      <button id="reset-camera" type="button" aria-label="Reset camera">Reset view</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
